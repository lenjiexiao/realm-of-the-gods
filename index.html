<title>幻</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap">
<style>
:root {
  --bg: #0a0b10; --bg2: #151823; --panel: rgba(18, 22, 36, 0.55);
  --fg: #d6dbea; --dim: #8b94a7; --faint: #555e73;
  --lapis: #2a5cd8; --wing: #7fd8ff; --gold: #c9a961; --gold-soft: rgba(201, 169, 97, 0.16);
  --seal: #a02c22; --hairline: rgba(139, 148, 167, 0.16);
  --font-hand: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(180deg, #0c0e15 0%, var(--bg) 100%);
  background-attachment: fixed;
  color: var(--fg); font-family: var(--font-body); font-weight: 300;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  min-height: 100vh; overflow-x: hidden;
}
/* 晕影：四周暗角，展厅的昏暗 */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 90% 70% at 50% 38%, transparent 50%, rgba(2, 3, 6, 0.55) 100%);
}
/* 胶片颗粒 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.05; mix-blend-mode: overlay;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="240" height="240" filter="url(%23n)" opacity="0.6"/></svg>');
}
#air { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#flight { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; max-width: 72em; margin: 0 auto; padding-block: 7vh 9vh; }

/* ================= 开幕 ================= */
header { text-align: center; padding-block: 4vh 2vh; }
h1 {
  font-family: var(--font-hand); font-weight: 400;
  font-size: clamp(3rem, 9vw, 4.8rem); letter-spacing: 0.22em; text-indent: 0.22em;
  animation: title-in 1.6s ease both;
}
@keyframes title-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
header .sub { color: var(--dim); font-size: 0.85rem; letter-spacing: 0.9em; text-indent: 0.9em; margin-top: 1.6em; }
header .rule {
  width: 5em; height: 1px; margin: 3em auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ================= 主展品 ================= */
.featured { margin: 7vh auto 4vh; max-width: 34em; }
.frame {
  position: relative; padding: 0.9em; cursor: zoom-in;
  background: linear-gradient(160deg, rgba(24, 33, 66, 0.7), rgba(12, 17, 38, 0.85));
  border: 1px solid var(--hairline);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 60px rgba(42, 92, 216, 0.12);
  transition: box-shadow 0.5s ease, border-color 0.5s ease, transform 0.5s ease;
  animation: rise 1.4s 0.3s ease both;
}
.frame:hover {
  border-color: rgba(201, 169, 97, 0.45);
  box-shadow: 0 34px 90px rgba(0, 0, 0, 0.6), 0 0 80px rgba(42, 92, 216, 0.2);
  transform: translateY(-3px);
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.frame .inner { overflow: hidden; }
/* 显影：画从雾里慢慢浮现，目光落到才清晰 */
.frame img, .frame-small img {
  width: 100%; display: block;
  filter: blur(3px) brightness(0.82); opacity: 0.3;
  transition: filter 2.4s ease, opacity 2.4s ease, transform 0.8s cubic-bezier(0.2, 0.6, 0.2, 1);
}
figure.seen .inner img, figure:hover .inner img { filter: none; opacity: 1; }
.frame:hover img { transform: scale(1.03); }
.featured .spot {
  position: absolute; inset: -40% -20% auto; height: 160%; pointer-events: none;
  background: radial-gradient(ellipse 60% 45% at 50% 0%, rgba(255, 226, 176, 0.10), transparent 70%);
}
.featured-label { text-align: center; margin-top: 2.2em; }
.featured-label .fm { font-family: var(--font-hand); color: var(--gold); font-size: 1.2rem; letter-spacing: 0.24em; text-indent: 0.24em; opacity: 0.9; }
.featured-label .t { font-size: 1.3rem; letter-spacing: 0.2em; margin-top: 0.7em; }

/* ================= 展签分组 ================= */
.group-label {
  display: flex; align-items: center; gap: 1.6em; margin: 11vh 0 3.4vh;
  font-family: var(--font-hand); font-size: 2rem; color: var(--gold); letter-spacing: 0.4em;
}
.group-label .en { font-family: var(--font-body); font-size: 0.75rem; color: var(--faint); letter-spacing: 0.3em; margin-top: 0.3em; }
.group-label .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-soft), transparent); }
.group-label .gcol { display: flex; flex-direction: column; }

/* 漂浮的呓语 */
.drift-line {
  text-align: center; font-family: var(--font-hand);
  color: var(--dim); font-size: clamp(1.05rem, 2.4vw, 1.3rem);
  letter-spacing: 0.3em; text-indent: 0.3em; max-width: 40em;
  margin: 2vh auto 0; opacity: 0;
  animation: drift-in 2.4s 0.6s ease both, floaty 11s 3s ease-in-out infinite;
}
@keyframes drift-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.72; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* ================= 展墙 ================= */
.masonry { columns: 2; column-gap: 2.6em; }
@media (max-width: 560px) { .masonry { columns: 1; } }
figure {
  break-inside: avoid; margin: 0 0 2.6em; cursor: zoom-in;
  animation: rise 1s ease both; animation-delay: var(--d, 0s);
}
.frame-small {
  background: linear-gradient(160deg, rgba(22, 30, 60, 0.6), rgba(11, 15, 34, 0.8));
  border: 1px solid var(--hairline); padding: 0.55em;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  transition: border-color 0.45s ease, box-shadow 0.45s ease, transform 0.45s ease;
}
figure:hover .frame-small {
  border-color: rgba(201, 169, 97, 0.45);
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5), 0 0 44px rgba(42, 92, 216, 0.18);
  transform: translateY(-3px);
}
.frame-small .inner { overflow: hidden; }
figure:hover .frame-small img { transform: scale(1.035); }

/* 展签：一句呓语 + 画名 */
.label { padding: 1.1em 0.4em 0.2em; }
.label .fm {
  display: block; font-family: var(--font-hand);
  color: var(--dim); font-size: 1.15rem; letter-spacing: 0.14em; opacity: 0.85;
  padding-top: 0.9em; border-top: 1px solid var(--hairline);
  transition: color 0.45s, opacity 0.45s;
}
figure:hover .label .fm { color: var(--gold); opacity: 1; }
.label .t { font-size: 1.05rem; letter-spacing: 0.14em; margin-top: 0.55em; }
.label .a { color: var(--dim); font-size: 0.8rem; margin-top: 0.4em; letter-spacing: 0.08em; }

/* ================= 灯箱 ================= */
#lightbox {
  position: fixed; inset: 0; z-index: 30; display: none;
  background: rgba(4, 6, 16, 0.95); backdrop-filter: blur(8px);
  flex-direction: column; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#lightbox.open { display: flex; animation: lb-in 0.35s ease; }
@keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }
.lb-stage {
  padding: 0.9em; background: rgba(16, 22, 46, 0.6);
  border: 1px solid rgba(201, 169, 97, 0.35); border-radius: 2px;
  box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7);
}
#lb-img { max-width: min(88vw, 62em); max-height: 72vh; display: block; }
#lb-cap { text-align: center; margin-top: 1.8em; }
#lb-cap .no { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.4em; text-indent: 0.4em; }
#lb-cap .t { font-size: 1.25rem; letter-spacing: 0.18em; margin-top: 0.6em; }
#lb-cap .a { color: var(--dim); font-size: 0.88rem; margin-top: 0.5em; letter-spacing: 0.1em; }
#lb-cap .s { color: var(--faint); font-size: 0.72rem; margin-top: 0.6em; letter-spacing: 0.1em; }
.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: none; border: 1px solid var(--hairline); color: var(--fg);
  font-size: 1.5rem; width: 3em; height: 3em; border-radius: 50%; cursor: pointer;
  transition: border-color 0.3s, color 0.3s, background 0.3s;
}
.nav-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201, 169, 97, 0.06); }
#lb-prev { left: max(14px, env(safe-area-inset-left, 0px)); }
#lb-next { right: max(14px, env(safe-area-inset-right, 0px)); }
#lb-close {
  position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  background: none; border: 1px solid transparent; color: var(--dim); font-size: 0.85rem;
  cursor: pointer; letter-spacing: 0.3em; padding: 0.8em 1em; transition: color 0.3s, border-color 0.3s;
}
#lb-close:hover { color: var(--fg); border-color: var(--hairline); }

/* ================= 蝶影与尘光 ================= */
.butterfly {
  position: absolute; left: 0; top: 0; will-change: transform;
  opacity: 0.55; filter: blur(1.4px);
}
.butterfly svg { display: block; overflow: visible; }
.wl, .wr { transform-box: fill-box; }
.wl { transform-origin: 100% 50%; animation: flap 0.9s ease-in-out infinite; }
.wr { transform-origin: 0% 50%; animation: flap 0.9s ease-in-out infinite; }
@keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.32); } }

/* ================= 页脚 ================= */
footer {
  margin-top: 12vh; border-top: 1px solid var(--hairline); padding-top: 2.6em;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5em; flex-wrap: wrap;
}
footer .credit { color: var(--faint); font-size: 0.75rem; letter-spacing: 0.18em; line-height: 2.2; }
.seal {
  writing-mode: vertical-rl; font-family: var(--font-hand);
  font-size: 1.35rem; line-height: 1; letter-spacing: 0.14em;
  color: #f3e9da; background: var(--seal); padding: 0.55em 0.4em;
  border-radius: 3px; box-shadow: 0 0 22px rgba(160, 44, 34, 0.4), inset 0 0 8px rgba(60, 12, 8, 0.55);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  figure { opacity: 1; }
  figure .inner img { filter: none; opacity: 1; }
  .drift-line { opacity: 0.72; }
}
</style>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 灯箱 ---------- */
  var figs = Array.prototype.slice.call(document.querySelectorAll("figure"));
  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var capNo = document.querySelector("#lb-cap .no");
  var capT = document.querySelector("#lb-cap .t");
  var capA = document.querySelector("#lb-cap .a");
  var capS = document.querySelector("#lb-cap .s");
  var cur = -1;

  function show(i) {
    cur = (i + figs.length) % figs.length;
    var parts = figs[cur].getAttribute("data-cap").split("|");
    lbImg.src = figs[cur].querySelector("img").src;
    lbImg.alt = parts[0];
    capNo.textContent = (cur + 1 < 10 ? "0" : "") + (cur + 1) + " / " + figs.length;
    capT.textContent = parts[0];
    capA.textContent = parts[1];
    capS.textContent = parts[2];
    lb.classList.add("open");
  }
  function hide() { lb.classList.remove("open"); }
  figs.forEach(function (f, i) { f.addEventListener("click", function () { show(i); }); });
  document.getElementById("lb-close").addEventListener("click", hide);
  document.getElementById("lb-prev").addEventListener("click", function (e) { e.stopPropagation(); show(cur - 1); });
  document.getElementById("lb-next").addEventListener("click", function (e) { e.stopPropagation(); show(cur + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) hide(); });
  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") hide();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);

  if ("IntersectionObserver" in window && !reduced) {

  var pools = [];

    '<defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#5d78a8" stop-opacity="0.34"/>' +

    el.style.opacity = (0.35 + Math.random() * 0.3).toFixed(2);
    flight.appendChild(el);
    flock.push({ el: el, size: size, x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      vx: 6 + Math.random() * 10, amp: 10 + Math.random() * 20,
      w: 0.0007 + Math.random() * 0.0009, ph: Math.random() * 6.28 });
  }

  function frame(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    /* 光池：缓慢呼吸的暖光 */
    for (var p = 0; p < pools.length; p++) {
      var pl = pools[p];
      var breathe = 0.6 + 0.4 * Math.sin(t * pl.w + pl.ph);
      var px = (pl.fx + Math.sin(t * pl.w * 0.6 + pl.ph) * 0.04) * innerWidth;
      var py = (pl.fy + Math.cos(t * pl.w * 0.5 + pl.ph) * 0.03) * innerHeight;
      var pr = pl.r * Math.max(innerWidth, innerHeight) * breathe;
      var g = ctx.createRadialGradient(px, py, 0, px, py, pr);
      g.addColorStop(0, "rgba(196,168,120," + (0.05 * breathe).toFixed(3) + ")");
      g.addColorStop(1, "rgba(196,168,120,0)");
      ctx.fillStyle = g;
      ctx.fillRect(px - pr, py - pr, pr * 2, pr * 2);
    }
    for (var j = 0; j < motes.length; j++) {
      var m = motes[j];
      m.y += m.vy * 0.016; m.x += Math.sin(t * 0.0004 + m.tw) * 0.12;
      if (m.y < -4) { m.y = innerHeight + 4; m.x = Math.random() * innerWidth; }
      var a = 0.1 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.001 + m.tw));
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28);
      ctx.fillStyle = m.warm ? "rgba(201,175,110," + a.toFixed(3) + ")"
                             : "rgba(150,170,200," + (a * 0.55).toFixed(3) + ")";
      ctx.fill();
    }
    for (j = 0; j < flock.length; j++) {
      var b = flock[j];
      b.x += b.vx * 0.016;
      if (b.x > innerWidth + 40) { b.x = -40; b.y = Math.random() * innerHeight; }
      var yy = b.y + Math.sin(t * b.w + b.ph) * b.amp;
      var tilt = Math.sin(t * b.w * 1.4 + b.ph) * 12;
      b.el.style.transform = "translate(" + (b.x - b.size / 2) + "px," + (yy - b.size * 0.41) + "px) rotate(" + tilt + "deg)";
    }
    if (!reduced) requestAnimationFrame(frame);
  }
  if (reduced) { frame(0); } else { requestAnimationFrame(frame); }
})();
</script>
